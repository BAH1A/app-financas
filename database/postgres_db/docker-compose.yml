services:
  postgres:
    image: postgres:16
    container_name: postgres_main
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
    - "${DB_PORT}:5432"
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/postgresql/data
